name: Build Telegram APK (web standalone, arm64)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure _sa icons in TMessagesProj_App
        run: |
          SRC="TMessagesProj_AppStandalone/src/main/res"
          DST="TMessagesProj_App/src/main/res"
          if [ -d "$SRC" ]; then
            for d in "$SRC"/mipmap-*; do
              [ -d "$d" ] || continue
              tgt="$DST/$(basename "$d")"
              mkdir -p "$tgt"
              find "$d" -name "*_sa*" -exec cp -v {} "$tgt/" \;
            done
          fi
          echo "=== _sa files in TMessagesProj_App ==="
          find "$DST" -name "*_sa*" | sort

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Decode Keystore
        run: |
          mkdir -p TMessagesProj/config
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore

      - name: Verify Keystore
        run: |
          echo "Keystore file size: $(stat -c%s TMessagesProj/config/release.keystore) bytes"
          keytool -list -keystore TMessagesProj/config/release.keystore \
            -storepass "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD" \
            -alias "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" || {
              echo "::error::Keystore 验证失败"
              exit 1
            }

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep -E "^APP_VERSION_NAME" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          VERSION_CODE=$(grep -E "^APP_VERSION_CODE" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      # =========================
      # Debug 包（beta）— 默认关闭
      # 需要时取消下面两行的注释
      # =========================
      # - name: Build Debug APK (beta, arm64-v8a)
      #   run: ./gradlew :TMessagesProj_App:assembleAfatDebug -Pandroid.injected.build.abi=arm64-v8a

      # =========================
      # Standalone 包（web）
      # =========================
      - name: Build Standalone APK (web, arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleAfatStandalone -Pandroid.injected.build.abi=arm64-v8a

      - name: List all APK files
        run: find . -name "*.apk" -type f

      - name: Collect APKs
        run: |
          mkdir -p release-assets
          VER="${{ steps.version.outputs.name }}"
          echo "Using version: ${VER}"

          # Debug 包（beta）— 默认关闭
          # find TMessagesProj_App -path "*intermediates/apk/*debug*.apk" \
          #   -exec cp {} "release-assets/telegram-beta-${VER}-arm64.apk" \;
          # find TMessagesProj_App -path "*outputs/apk/*debug*.apk" \
          #   -exec cp {} "release-assets/telegram-beta-${VER}-arm64.apk" \;

          # Standalone 包（web）
          find TMessagesProj_App -path "*intermediates/apk/*standalone*.apk" \
            -exec cp {} "release-assets/telegram-web-${VER}-arm64.apk" \;
          find TMessagesProj_App -path "*outputs/apk/*standalone*.apk" \
            -exec cp {} "release-assets/telegram-web-${VER}-arm64.apk" \;

          echo "Collected files:"
          ls -lh release-assets/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-arm64-${{ steps.version.outputs.name }}
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "v${{ steps.version.outputs.name }} (build ${{ github.run_number }})"
          body: |
            Telegram 编译产物
            - 上游版本号：${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
            - 上游 commit：${{ steps.version.outputs.sha }}
            - 架构：arm64-v8a
            - `telegram-web-*-arm64.apk`：Standalone 包，包名 `.web`
          files: release-assets/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
