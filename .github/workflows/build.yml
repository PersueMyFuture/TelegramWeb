name: Build Telegram APK

on:
  workflow_dispatch: # 允许在 Actions 页面手动点击触发
  push:
    branches: [ master, main ] # 推送代码时自动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 关键：拉取 Telegram 的所有子模块

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-debug-arm64
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
