name: Build Telegram APKs

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # =========================
      # Debug 64 位
      # =========================
      - name: Build Debug APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: List all APK files (debug check)
        run: find . -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-debug-arm64
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # =========================
      # Release 64 位（需要签名 Secrets）
      # 若未配置 KEYSTORE_BASE64 等 Secrets，请保持下面四步为注释状态
      # =========================
      # - name: Decode Release Keystore
      #   run: |
      #     mkdir -p TMessagesProj/config
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore

      # - name: Build Release APK (arm64-v8a)
      #   run: ./gradlew :TMessagesProj_App:assembleRelease -Pandroid.injected.build.abi=arm64-v8a

      # - name: List all APK files (release check)
      #   run: find . -name "*.apk" -type f

      # - name: Upload Release APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: telegram-release-arm64
      #     path: |
      #       TMessagesProj/build/outputs/apk/**/*.apk
      #       TMessagesProj_App/build/outputs/apk/**/*.apk
      #     if-no-files-found: warn

      # =========================
      # Web / Standalone 64 位
      # =========================
      - name: Build Web Standalone APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleStandalone -Pandroid.injected.build.abi=arm64-v8a

      - name: List all APK files (web check)
        run: find . -name "*.apk" -type f

      - name: Upload Web Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-standalone-arm64
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: warn
