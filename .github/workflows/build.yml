name: Build Telegram APKs

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]   # 推送 v 开头的 tag 时自动发 Release

permissions:
  contents: write    # 关键：允许创建/更新 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # =========================
      # Debug 64 位
      # =========================
      - name: Build Debug APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect Debug APK
        run: |
          mkdir -p release-assets
          find TMessagesProj_App -path "*intermediates/apk/*debug*.apk" -exec cp {} release-assets/telegram-debug-arm64.apk \;
          find TMessagesProj_App -path "*outputs/apk/*debug*.apk" -exec cp {} release-assets/telegram-debug-arm64.apk \;

      # =========================
      # Web / Standalone 64 位
      # =========================
      - name: Build Web Standalone APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleStandalone -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect Web APK
        run: |
          find TMessagesProj_AppStandalone -path "*intermediates/apk*standalone*.apk" -exec cp {} release-assets/telegram-web-standalone-arm64.apk \;
          find TMessagesProj_AppStandalone -path "*outputs/apk*standalone*.apk" -exec cp {} release-assets/telegram-web-standalone-arm64.apk \;

      # =========================
      # 发布到 GitHub Release
      # =========================
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          files: |
            release-assets/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
