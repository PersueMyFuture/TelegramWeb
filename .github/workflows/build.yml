name: Build Telegram Web APKs (debug + standalone, arm64)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 关键：Gradle 会自动把 ORG_GRADLE_PROJECT_ 前缀识别为项目属性
    # build.gradle 里的 RELEASE_STORE_PASSWORD 等可直接读取，无需写入文件
    env:
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # =========================
      # Debug 包（afatDebug）
      # =========================
      - name: Build Debug APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -Pandroid.injected.build.abi=arm64-v8a

      # =========================
      # Standalone 包（afatStandalone）
      # =========================
      - name: Build Standalone APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleAfatStandalone -Pandroid.injected.build.abi=arm64-v8a

      - name: List all APK files
        run: find . -name "*.apk" -type f

      - name: Collect APKs
        run: |
          mkdir -p release-assets
          find TMessagesProj_App -path "*intermediates/apk/*debug*.apk" -exec cp {} release-assets/telegram-web-debug-arm64.apk \;
          find TMessagesProj_App -path "*outputs/apk/*debug*.apk" -exec cp {} release-assets/telegram-web-debug-arm64.apk \;
          find TMessagesProj_App -path "*intermediates/apk/*standalone*.apk" -exec cp {} release-assets/telegram-web-standalone-arm64.apk \;
          find TMessagesProj_App -path "*outputs/apk/*standalone*.apk" -exec cp {} release-assets/telegram-web-standalone-arm64.apk \;

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep -E "^APP_VERSION_NAME" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          VERSION_CODE=$(grep -E "^APP_VERSION_CODE" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-arm64
          path: release-assets/*.apk
          if-no-files-found: warn

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "v${{ steps.version.outputs.name }} (build ${{ github.run_number }})"
          body: |
            Telegram Web 编译产物
            - 版本号：${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
            - 上游 commit：${{ steps.version.outputs.sha }}
            - 架构：arm64-v8a
            - 包含：Debug 包、Standalone 包
            - 包名：org.telegram.messenger.web
          files: release-assets/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
