name: Build Telegram Web APKs (debug + standalone, arm64)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Decode Keystore
        run: |
          mkdir -p TMessagesProj/config
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore

      - name: Inject signing properties
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> gradle.properties

      # =========================
      # Debug 包（afatDebug）
      # =========================
      - name: Build Debug APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -Pandroid.injected.build.abi=arm64-v8a

      # =========================
      # Standalone 包（afatStandalone）
      # =========================
      - name: Build Standalone APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleAfatStandalone -Pandroid.injected.build.abi=arm64-v8a

      - name: List all APK files
        run: find . -name "*.apk" -type f

      - name: Collect APKs
        run: |
          mkdir -p release-assets
          find TMessagesProj_App -path "*intermediates/apk/*debug*.apk" -exec cp {} release-assets/telegram-web-debug-arm64.apk \;
          find TMessagesProj_App -path "*outputs/apk/*debug*.apk" -exec cp {} release-assets/telegram-web-debug-arm64.apk \;
          find TMessagesProj_App -path "*intermediates/apk/*standalone*.apk" -exec cp {} release-assets/telegram-web-standalone-arm64.apk \;
          find TMessagesProj_App -path "*outputs/apk/*standalone*.apk" -exec cp {} release-assets/telegram-web-standalone-arm64.apk \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-arm64
          path: release-assets/*.apk
          if-no-files-found: warn

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (web debug + standalone arm64)
          files: release-assets/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
