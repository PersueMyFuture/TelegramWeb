name: Build Telegram APKs

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # =========================
      # Debug 64 位
      # =========================
      - name: Build Debug APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_App:assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect Debug APK
        run: |
          mkdir -p artifacts/debug
          find . -path "*/intermediates/apk/*/debug/*.apk" -exec cp {} artifacts/debug/ \;
          find . -path "*/outputs/apk/*/debug/*.apk" -exec cp {} artifacts/debug/ \;
          echo "=== Collected Debug APKs ==="
          ls -la artifacts/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-debug-arm64
          path: artifacts/debug/*.apk
          if-no-files-found: warn

      # =========================
      # Release 64 位（需要签名 Secrets）
      # 若未配置 KEYSTORE_BASE64 等 Secrets，请保持下面五步为注释状态
      # =========================
      # - name: Decode Release Keystore
      #   run: |
      #     mkdir -p TMessagesProj/config
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore

      # - name: Build Release APK (arm64-v8a)
      #   run: ./gradlew :TMessagesProj_App:assembleRelease -Pandroid.injected.build.abi=arm64-v8a

      # - name: Collect Release APK
      #   run: |
      #     mkdir -p artifacts/release
      #     find . -path "*/intermediates/apk/*/release/*.apk" -exec cp {} artifacts/release/ \;
      #     find . -path "*/outputs/apk/*/release/*.apk" -exec cp {} artifacts/release/ \;
      #     echo "=== Collected Release APKs ==="
      #     ls -la artifacts/release/

      # - name: Upload Release APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: telegram-release-arm64
      #     path: artifacts/release/*.apk
      #     if-no-files-found: warn

      # =========================
      # Web / Standalone 64 位
      # =========================
      - name: Build Web Standalone APK (arm64-v8a)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleStandalone -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect Web Standalone APK
        run: |
          mkdir -p artifacts/web
          find . -path "*/intermediates/apk/*/standalone/*.apk" -exec cp {} artifacts/web/ \;
          find . -path "*/intermediates/apk/*/*/standalone/*.apk" -exec cp {} artifacts/web/ \;
          find . -path "*/outputs/apk/*/standalone/*.apk" -exec cp {} artifacts/web/ \;
          find . -path "*/outputs/apk/*/*/standalone/*.apk" -exec cp {} artifacts/web/ \;
          echo "=== Collected Web Standalone APKs ==="
          ls -la artifacts/web/

      - name: Upload Web Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-standalone-arm64
          path: artifacts/web/*.apk
          if-no-files-found: warn
